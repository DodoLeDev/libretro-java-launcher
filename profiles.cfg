# Profiles: [profile_name]
[java]
extensions = jar
command = java {args} -jar {file}

[wine]
extensions = exe|bat
command = wine {args} {file}
env = WINEPREFIX=/home/me/.wine-games

# Presets: [preset:preset_name]
[preset:720p]
width = 1280
height = 720

[preset:big-heap]
args = -Xmx4g

[preset:wayland-fix]
env = _JAVA_AWT_WM_NONREPARENTING=1
